<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore the Manor — 3D prototype</title>
<link rel="preload" as="image" href="assets/manor-1800.avif" type="image/avif" media="(min-width:990px)" fetchpriority="high">
<link rel="preload" as="image" href="assets/manor-900.avif" type="image/avif" media="(max-width:989px)" fetchpriority="high">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,600&display=swap"></noscript>
<style>
:root{
  --bg:#07070c; --ink:#efe7dd; --muted:#9a9098;
  --blood:#8e1116; --blood-lt:#c8232a; --gold:#c9a86a;
  --grow:1.22;          /* наскільки кімната виходить на передній план */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
body{overflow-x:hidden}

.wrap{max-width:1560px;margin:0 auto;padding:56px 16px 90px}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#f2ece4;margin:0 0 16px}
.eyebrow svg{width:32px;height:11px;fill:var(--blood-lt);flex:none}
h1.title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:clamp(40px,7.4vw,116px);line-height:.96;letter-spacing:.03em;text-align:center;
  margin:0 0 6px;text-transform:uppercase;text-shadow:0 0 44px rgba(190,40,40,.26)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 26px}

/* ───────── сцена: лише 4 шари замість двох десятків ───────── */
.stage{position:relative;perspective:1600px;perspective-origin:50% 42%;overflow:clip;
  padding:40px 0 30px;margin:-40px 0 -30px}
.manor{position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.manor__base{display:block;width:100%;height:auto;opacity:0;transition:opacity .4s ease}
.is-in .manor__base{opacity:1}

/* затемнення — простий прозорий шар, без filter: майже безкоштовно */
.dim{position:absolute;inset:0;background:#05050b;opacity:0;pointer-events:none;
  transition:opacity .3s ease;z-index:2}
.has-open .dim{opacity:.64}

/* ЄДИНИЙ шар кімнати — полігон підставляється під ту, на яку навели */
.room{position:absolute;z-index:3;pointer-events:none;
  left:var(--x,0);top:var(--y,0);width:var(--w,0);height:var(--h,0);
  clip-path:polygon(var(--poly,0 0,0 0,0 0));
  background-image:url("assets/manor-1800.webp");
  background-image:image-set(url("assets/manor-1800.avif") type("image/avif"),
                             url("assets/manor-1800.webp") type("image/webp"));
  background-size:var(--bgs,100% 100%);
  background-position:var(--bgp,0 0);
  transform-origin:50% 50%;transform:scale(1);opacity:0;
  transition:transform .32s cubic-bezier(.22,.9,.28,1), opacity .18s ease;
  will-change:transform,opacity}
.has-open .room{opacity:1;transform:scale(var(--grow));
}
/* тепле світло — той самий маленький шар, без окремого елемента */
.room::after{content:"";position:absolute;inset:0;
  background:radial-gradient(58% 66% at 50% 46%, rgba(255,198,130,.17), rgba(205,60,50,.07) 48%, transparent 68%)}

/* прозорі полігони ловлять курсор — растеризації нуль */
.hit{position:absolute;inset:0;z-index:10;width:100%;height:100%}
.hit polygon{fill:#fff;fill-opacity:0;pointer-events:fill;
  transform-box:fill-box;transform-origin:50% 50%;
  transition:transform .32s cubic-bezier(.22,.9,.28,1);
  cursor:url("assets/cursor-hand.png") 16 8, pointer}
.hit polygon.on{transform:scale(var(--grow))}
/* на дотик зона трохи більша — пальцем влучити важче, ніж курсором */
@media (hover:none){ .hit polygon{transform:scale(1.02)} }

/* ───────── мітки й картки ───────── */
.pin{position:absolute;transform:translate(-50%,50%);z-index:20;pointer-events:none;transition:opacity .3s}
.pin__dot{position:relative;width:32px;height:32px;margin:0 auto;display:grid;place-items:center}
.pin__dot i{display:block;width:9px;height:9px;rotate:45deg;background:var(--blood-lt);
  box-shadow:0 0 12px 3px rgba(200,35,42,.5);transition:.3s}
.pin__dot::after{content:"";position:absolute;inset:0;border:1px solid rgba(201,168,106,.45);rotate:45deg;
  opacity:.7;transition:.3s}
.pin.on .pin__dot i{scale:1.45;background:#ffd08a;box-shadow:0 0 18px 6px rgba(255,190,110,.55)}
.pin.on .pin__dot::after{scale:1.3;opacity:1;border-color:rgba(255,208,138,.8)}
.pin__label{margin-top:5px;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-size:clamp(17px,1.5vw,27px);color:#f4ede4;white-space:nowrap;text-shadow:0 2px 14px #000;transition:.3s}
.pin__note{margin-top:2px;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(12px,1vw,16px);color:#cfc4b8;max-width:210px;text-shadow:0 2px 10px #000}
.pin.on .pin__label{color:#ffd9a6}
.pin__cta{margin-top:4px;text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#e6c07a;opacity:0;transition:opacity .3s ease;text-shadow:0 2px 10px #000;white-space:nowrap}
.pin.on .pin__cta{opacity:.95}
.toast{position:fixed;left:50%;bottom:108px;translate:-50% 8px;z-index:300;
  background:rgba(12,10,16,.96);border:1px solid rgba(201,168,106,.45);color:#f2ece4;
  padding:11px 18px;font-size:12.5px;letter-spacing:.03em;opacity:0;pointer-events:none;
  transition:opacity .25s ease, translate .25s ease}
.toast.on{opacity:1;translate:-50% 0}
.has-open .pin:not(.on){opacity:.2}

.card{position:absolute;left:50%;top:calc(100% + 14px);translate:-50% 12px;width:min(320px,74vw);
  background:linear-gradient(180deg,#15111c,#0b0810);border:1px solid rgba(201,168,106,.34);
  padding:14px 14px 18px;box-shadow:0 24px 50px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;transition:opacity .28s ease, translate .28s ease;z-index:30}
.pin.on .card{opacity:1;translate:-50% 0;pointer-events:auto}
.card--l{left:0;translate:-8px 12px}   .pin.on .card--l{translate:-8px 0}
.card--r{left:auto;right:0;translate:8px 12px} .pin.on .card--r{translate:8px 0}
.card--up{top:auto;bottom:calc(100% + 14px);translate:-50% -12px}
.pin.on .card--up{translate:-50% 0}
.card--up.card--l{translate:-8px -12px}  .pin.on .card--up.card--l{translate:-8px 0}
.card--up.card--r{translate:8px -12px}   .pin.on .card--up.card--r{translate:8px 0}
.card img,.card picture,.mcard img,.mcard picture{width:100%;height:auto;display:block}
.card__num{font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);letter-spacing:.3em;
  font-size:13px;margin:12px 0 4px}
.card h3,.mcard h3{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;
  font-size:26px;margin:0 0 6px;color:#f7f1e8}
.card p,.mcard p{margin:0 0 14px;font-size:13.5px;line-height:1.5;color:#b9b0a6}
.card a,.mcard a{display:inline-block;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#f7f1e8;border:1px solid rgba(201,168,106,.5);padding:11px 18px;transition:.25s}
.card a:hover{background:var(--blood);border-color:var(--blood-lt)}

/* атмосфера — статична, без анімацій і без blend-режимів */
.fog{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(52% 40% at 50% 26%, rgba(120,90,150,.09), transparent 70%),
             radial-gradient(45% 34% at 84% 58%, rgba(150,70,70,.07), transparent 70%)}

/* телефон */
.mcard{display:none;max-width:460px;margin:16px auto 0;background:linear-gradient(180deg,#15111c,#0b0810);
  border:1px solid rgba(201,168,106,.34);padding:12px 12px 16px;opacity:0;transition:opacity .3s;
  pointer-events:none}
.mcard.on{opacity:1;pointer-events:auto}
.tabs{display:none;gap:8px;margin:16px auto 0;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none}
.tabs button{font:inherit;font-size:12px;color:#d6ccc2;background:rgba(16,14,20,.9);
  border:1px solid rgba(201,168,106,.3);padding:10px 14px;cursor:pointer}
.tabs button.on{background:var(--blood);border-color:var(--blood-lt);color:#fff}

.hud{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:200;display:flex;gap:6px;flex-wrap:wrap;
  justify-content:center;max-width:94vw;background:rgba(10,9,14,.94);border:1px solid rgba(201,168,106,.28);padding:6px}
.hud button{font:inherit;font-size:11.5px;font-weight:600;color:#cfc5ba;background:transparent;
  border:1px solid transparent;padding:8px 12px;cursor:pointer;transition:.2s;white-space:nowrap}
.hud button:hover{color:#fff;border-color:rgba(201,168,106,.4)}
.hud button.on{background:var(--blood);color:#fff;border-color:var(--blood-lt)}
.hint{position:fixed;left:50%;bottom:64px;translate:-50% 0;z-index:200;color:#8b8289;font-size:11.5px;
  pointer-events:none;transition:opacity .4s;text-align:center;max-width:90vw}

/* «як зараз» — ефекти вимкнені */
.flat .room,.flat .dim{opacity:0!important}
.flat .manor{transform:none!important}
.flat .pin{opacity:1!important}

@media (max-width:989px){
  .wrap{padding:34px 12px 200px}
  .stage{perspective:none;padding:14px 0}
  .room{background-image:url("assets/manor-900.webp");
    background-image:image-set(url("assets/manor-900.avif") type("image/avif"),
                               url("assets/manor-900.webp") type("image/webp"))}
  :root{--grow:1.34}
  .pin__note{display:none}
  .pin .card{display:none}
  .pin:not(.on) .pin__label{opacity:0}
  .pin__label{font-size:14px}
  body .mcard{display:block}
  .tabs{display:flex}
  .hud{bottom:10px;padding:5px}
  .hud button{font-size:11px;padding:7px 10px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.room,.manor{transition:none}}
html.shot .hud,html.shot .hint{display:none}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">
    <svg viewBox="0 0 24 8.45"><path d="M9.15,1.37c-.02,1.18,1.65,2.1,1.65,2.1-1.7-.05-1.93-1.09-1.93-1.09-.38,1.09-1.54.88-1.9.63-.65-.44-.57-.92-.57-.92C4.18,3.85,0,4.16,0,4.16v.13s4.18.31,6.4,2.08c0,0-.08-.49.57-.92.36-.24,1.52-.46,1.9.63,0,0,.23-1.05,1.93-1.09,0,0-1.67.91-1.65,2.1.02,1.18.99,1.43,1.45,1.37,0,0-.34-.18-.31-.84.04-.66.74-.68.94-.68.68,0,1.23.97,1.79.93,1.22-.08.99-1.05.99-1.05,0,0-.61.26-.76-.28-.15-.57.41-1.29,1.28-1.29s1.43.61,1.27,1.17c0,0,5.85-2.12,8.19-2.12v-.13c-2.34,0-8.19-2.12-8.19-2.12.16.57-.39,1.17-1.27,1.17s-1.44-.71-1.28-1.29c.14-.54.76-.28.76-.28,0,0,.23-.98-.99-1.05-.56-.03-1.11.92-1.79.93-.2,0-.9-.02-.94-.68-.04-.66.31-.84.31-.84-.46-.06-1.43.18-1.45,1.37h0Z"/></svg>
    <span>Behind every great house lies a story</span>
    <svg viewBox="0 0 24 8.45"><path d="M9.15,1.37c-.02,1.18,1.65,2.1,1.65,2.1-1.7-.05-1.93-1.09-1.93-1.09-.38,1.09-1.54.88-1.9.63-.65-.44-.57-.92-.57-.92C4.18,3.85,0,4.16,0,4.16v.13s4.18.31,6.4,2.08c0,0-.08-.49.57-.92.36-.24,1.52-.46,1.9.63,0,0,.23-1.05,1.93-1.09,0,0-1.67.91-1.65,2.1.02,1.18.99,1.43,1.45,1.37,0,0-.34-.18-.31-.84.04-.66.74-.68.94-.68.68,0,1.23.97,1.79.93,1.22-.08.99-1.05.99-1.05,0,0-.61.26-.76-.28-.15-.57.41-1.29,1.28-1.29s1.43.61,1.27,1.17c0,0,5.85-2.12,8.19-2.12v-.13c-2.34,0-8.19-2.12-8.19-2.12.16.57-.39,1.17-1.27,1.17s-1.44-.71-1.28-1.29c.14-.54.76-.28.76-.28,0,0,.23-.98-.99-1.05-.56-.03-1.11.92-1.79.93-.2,0-.9-.02-.94-.68-.04-.66.31-.84.31-.84-.46-.06-1.43.18-1.45,1.37h0Z"/></svg>
  </p>
  <h1 class="title">Explore the Manor</h1>
  <p class="sub" id="sub">прототип · наведи на кімнату — вона одразу виходить на передній план</p>

  <div class="stage" id="stage">
    <div class="manor" id="manor">
      <picture>
        <source type="image/avif" media="(max-width:989px)" srcset="assets/manor-900.avif">
        <source type="image/webp" media="(max-width:989px)" srcset="assets/manor-900.webp">
        <source type="image/avif" srcset="assets/manor-1800.avif">
        <source type="image/webp" srcset="assets/manor-1800.webp">
        <img class="manor__base" src="assets/manor-1800.webp" alt="Fright Delights manor"
             width="1800" height="1461" fetchpriority="high" decoding="async">
      </picture>
      <div class="fog"></div>
      <div class="dim"></div>
      <div class="room" id="room"></div>
      <svg class="hit" id="hit" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="mcard" id="mcard"></div>
</div>

<p class="hint" id="hint">наведи на кімнату — і натисни, щоб зайти в неї</p>
<div class="hud">
  <button id="bFx" class="on">Ефект</button>
  <button id="bFlat">Як зараз</button>
</div>

<script>
const P = {
  grand_hall:[[38.5,14.6],[59.3,14.6],[59.3,17.6],[62.8,19.6],[62.8,47.6],[35.3,47.6],[35.3,19.6],[38.5,17.6]],
  costume:   [[9.6,28.2],[35.3,26.8],[35.3,47.6],[5.8,47.6]],
  curiosity: [[62.8,26.8],[74.0,26.8],[74.4,24.1],[84.2,24.1],[84.6,26.8],[93.9,26.8],[94.6,47.6],[62.8,47.6]],
  apothecary:[[5.8,47.6],[28.5,47.6],[28.5,63.5],[5.0,63.5]],
  library:   [[28.5,47.6],[46.5,47.6],[46.5,63.5],[28.5,63.5]],
  drawing:   [[54.5,47.6],[78.0,47.6],[78.0,63.5],[54.5,63.5]],
  faces:     [[5.0,63.5],[34.5,63.5],[34.5,86.0],[4.5,86.0]],
  vault:     [[34.5,63.5],[63.0,63.5],[63.0,86.0],[34.5,86.0]],
  parlor:    [[63.0,63.5],[95.0,63.5],[95.0,86.0],[63.0,86.0]],
  dungeon:   [[4.5,86.0],[95.0,86.0],[95.0,96.5],[4.5,96.5]]
};
const ROOMS = [
  {k:'grand_hall',n:'01',title:'The Grand Hall',       text:'Newest arrivals and seasonal highlights', left:39.7,bottom:53.1,href:'/collections'},
  {k:'costume',   n:'02',title:'The Costume Wing',     text:'Distinctive costumes',                    left:11.6,bottom:52.2,href:'/collections'},
  {k:'curiosity', n:'03',title:'The Curiosity Cabinet',text:'Rare collectibles and unusual finds',      left:68.2,bottom:52.2,href:'/collections'},
  {k:'apothecary',n:'04',title:'The Apothecary',       text:'FX makeup and special effects',            left:5.0, bottom:34.5,href:'/collections'},
  {k:'library',   n:'05',title:'The Library',          text:'Guides and inspiration',                   left:28.0,bottom:34.5,href:'/collections'},
  {k:'drawing',   n:'06',title:'The Drawing Room',     text:'Atmospheric décor',                        left:56.0,bottom:34.5,href:'/collections'},
  {k:'faces',     n:'07',title:'Hall of Faces',        text:'Masks for every identity you dare',        left:13.0,bottom:16.8,href:'/collections'},
  {k:'vault',     n:'08',title:'The vault',            text:'Fine jewelry & precious artifacts',        left:39.5,bottom:17.8,href:'/collections'},
  {k:'parlor',    n:'09',title:'The Parlor',           text:'Games, puzzles & curiosities for play',     left:67.7,bottom:16.8,href:'/collections'},
  {k:'dungeon',   n:'10',title:'The Dungeon',          text:'Special offers lurk in the shadows',       left:39.6,bottom:3.8, href:'/collections/sale'}
];
ROOMS.forEach(r=>r.img='assets/room-'+r.k);

const stage=document.getElementById('stage'), manor=document.getElementById('manor'),
      room=document.getElementById('room'),
      hit=document.getElementById('hit'), tabs=document.getElementById('tabs'),
      mcard=document.getElementById('mcard'), hint=document.getElementById('hint'),
      sub=document.getElementById('sub');
const MOB = window.matchMedia('(max-width:989px)').matches;

const pic = (base) =>
  '<picture><source type="image/avif" srcset="'+base+'.avif">'+
  '<source type="image/webp" srcset="'+base+'.webp">'+
  '<img src="'+base+'.webp" alt="" loading="lazy" decoding="async" width="560" height="305"></picture>';

ROOMS.forEach(r=>{
  const box=P[r.k];
  /* межі кімнати у % від картинки */
  const x0=Math.min(...box.map(p=>p[0])), x1=Math.max(...box.map(p=>p[0]));
  const y0=Math.min(...box.map(p=>p[1])), y1=Math.max(...box.map(p=>p[1]));
  const w=x1-x0, h=y1-y0;
  r.geo = {
    x:x0+'%', y:y0+'%', w:w+'%', h:h+'%',
    /* картинка більша за шар рівно в 100/w разів — показуємо потрібний фрагмент */
    bgs:(100/w*100)+'% '+(100/h*100)+'%',
    bgp:(x0/(100-w)*100)+'% '+(y0/(100-h)*100)+'%',
    /* полігон перераховано в координати самого шару */
    poly:box.map(p=>((p[0]-x0)/w*100)+'% '+((p[1]-y0)/h*100)+'%').join(',')
  };

  const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points', box.map(p=>p[0]+','+p[1]).join(' '));
  hit.appendChild(poly); r.poly=poly;
  poly.addEventListener('pointerenter',()=>open_(r));
  poly.addEventListener('pointerdown',()=>open_(r));
  poly.addEventListener('click',e=>{
    e.preventDefault();
    /* на дотику перший тап лише відкриває кімнату — інакше палець випадково кудись переходить.
       Тач дублює події миші, тому орієнтуємось на час відкриття, а не на порядок подій. */
    if(MOB && Date.now() - (r.openedAt||0) < 500) return;
    go(r);
  });
  if(!MOB) poly.addEventListener('pointerleave',()=>close_(r));

  const pin=document.createElement('div');
  pin.className='pin'; pin.style.left=r.left+'%'; pin.style.bottom=r.bottom+'%';
  pin.innerHTML='<div class="card"></div>'+
    '<div class="pin__dot"><i></i></div><div class="pin__label">'+r.title+'</div>'+
    '<div class="pin__note">'+r.text+'</div>'+
    '<div class="pin__cta">'+(MOB?'торкнись ще раз, щоб зайти':'натисни, щоб зайти')+'</div>';
  manor.appendChild(pin);
  r.pin=pin;
  r.card=pin.querySelector('.card');
  r.card.addEventListener('click',e=>{ e.preventDefault(); go(r); });
  r.card.style.cursor='pointer';
  if(r.left<26) r.card.classList.add('card--l'); else if(r.left>74) r.card.classList.add('card--r');
  if(r.bottom<28) r.card.classList.add('card--up');   /* нижні ряди — картка вгору, щоб не вилізти */

  const b=document.createElement('button'); b.textContent=r.title;
  b.onclick=()=>{ current===r ? close_(r,true) : open_(r); };
  tabs.appendChild(b); r.tab=b;
});

/* ───────── один шар — підставляємо потрібний полігон ───────── */
/* перехід у колекцію кімнати */
const DEMO = !/myshopify|fright-delights/.test(location.host);
function go(r){
  if(DEMO){ toast('перехід у «'+r.title+'» → '+r.href); return; }
  location.href = r.href;
}
let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800);
}

let current=null, closeT=null, settleT=null, flat=false;
function open_(r){
  if(flat || current===r) return;
  clearTimeout(closeT);
  current=r;
  const g=r.geo, st=room.style;
  room.classList.remove('settled');
  st.setProperty('--x',g.x); st.setProperty('--y',g.y);
  st.setProperty('--w',g.w); st.setProperty('--h',g.h);
  st.setProperty('--poly',g.poly);
  st.setProperty('--bgs',g.bgs); st.setProperty('--bgp',g.bgp);
  stage.classList.add('has-open');
  ROOMS.forEach(x=>{ x.pin.classList.toggle('on', x===r); x.tab.classList.toggle('on', x===r);
                     x.poly.classList.toggle('on', x===r); });
  if(!r.filled){
    const body='<div class="card__num">'+r.n+'</div><h3>'+r.title+'</h3><p>'+r.text+'</p>'+
               '<a href="'+r.href+'">visit '+r.title+'</a>';
    r.card.innerHTML = pic(r.img)+body;
    r.filled=true;
  }
  mcard.innerHTML = pic(r.img)+'<h3>'+r.title+'</h3><p>'+r.text+'</p><a href="'+r.href+'">visit '+r.title+'</a>';
  mcard.classList.add('on');
  hint.style.opacity=0;
  r.openedAt=Date.now();
  clearTimeout(settleT);
  settleT=setTimeout(()=>{ if(current===r) room.classList.add('settled'); }, 360);
}
function close_(r,now){
  clearTimeout(closeT); clearTimeout(settleT);
  room.classList.remove('settled');
  closeT=setTimeout(()=>{
    current=null;
    stage.classList.remove('has-open');
    ROOMS.forEach(x=>{ x.pin.classList.remove('on'); x.tab.classList.remove('on'); x.poly.classList.remove('on'); });
    mcard.classList.remove('on');
    hint.style.opacity=1;
  }, now?0:70);
}
/* коротке «втискання» на натисканні */
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.hit polygon')) stage.classList.add('pressing'); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  stage.addEventListener(ev,()=>stage.classList.remove('pressing')));

/* тап повз кімнати — закрити */
document.addEventListener('pointerdown',e=>{
  if(!MOB || !current) return;
  if(e.target.closest('.hit polygon')||e.target.closest('.tabs')||
     e.target.closest('.mcard')||e.target.closest('.hud')) return;
  close_(current,true);
});

/* нахил за мишею прибрано: він змушував перемальовувати всю картинку щокадру */
if(false){
  let rx=0,ry=0,tx=0,ty=0,raf=null;
  stage.addEventListener('pointermove',e=>{
    if(flat||e.pointerType!=='mouse') return;
    const b=stage.getBoundingClientRect();
    tx=-((e.clientY-b.top)/b.height-.5)*5; ty=((e.clientX-b.left)/b.width-.5)*6;
    if(!raf) raf=requestAnimationFrame(tick);
  });
  stage.addEventListener('pointerleave',()=>{tx=0;ty=0;if(!raf)raf=requestAnimationFrame(tick);});
  function tick(){
    rx+=(tx-rx)*.12; ry+=(ty-ry)*.12;
    manor.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
    raf=(Math.abs(tx-rx)>.02||Math.abs(ty-ry)>.02)?requestAnimationFrame(tick):null;
  }
}

/* поява */
new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) stage.classList.add('is-in'); }),
  {threshold:.05}).observe(stage);
setTimeout(()=>stage.classList.add('is-in'),1200);
if(MOB) sub.textContent='прототип · торкнись кімнати — вона одразу виходить на передній план';

/* панель прототипу */
const bFx=document.getElementById('bFx'), bFlat=document.getElementById('bFlat');
bFx.onclick=()=>{ flat=false; stage.classList.remove('flat'); bFx.classList.add('on'); bFlat.classList.remove('on'); };
bFlat.onclick=()=>{ if(current) close_(current,true); flat=true; stage.classList.add('flat');
  bFlat.classList.add('on'); bFx.classList.remove('on'); };

/* демо-стан для знімків: ?state=open&room=..&shot=1 */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('shot')) document.documentElement.classList.add('shot');
  if(q.get('state')==='open'){
    stage.classList.add('is-in');
    const r=ROOMS.find(x=>x.k===(q.get('room')||'costume'));
    if(r) requestAnimationFrame(()=>open_(r));
  }
  if(q.get('state')==='flat'){ stage.classList.add('is-in'); bFlat.onclick(); }
})();
</script>
</body>
